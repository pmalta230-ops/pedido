<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft - Proposta Especial</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mc-dialog">
        <!-- Foto integrada diretamente -->
        <img src="foto.jpg" alt="Nossa Foto" class="mc-foto">
        
        <h1 id="titulo">Você quer se casar comigo no Minecraft e na vida real? 💍⛏️</h1>
        
        <div class="buttons-container">
            <button id="btn-sim" class="mc-btn">SIM!</button>
            <button id="btn-nao" class="mc-btn">NÃO</button>
        </div>
    </div>

    <!-- Tela de sucesso -->
    <div id="mensagem-sucesso" class="mc-dialog hidden">
        <h1>❤️ CONQUISTA ALCANÇADA! ❤️</h1>
        <p>Você aceitou o pedido! Agora somos um time para sempre!</p>
        <div class="heart-pixel">❤️</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
